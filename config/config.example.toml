[paths]
zotero_db = "<ZOTERO_DB_PATH>/zotero.sqlite"
zotero_storage = "<ZOTERO_STORAGE_PATH>/storage"
data_dir = "data"

[server]
host = "127.0.0.1"
port = 8765
require_api_token = true

[mcp]
# Maximum seconds to wait for a synchronous tool handler before returning a
# TimeoutError response. Keep this comfortably above the slowest expected
# vector search.
tool_timeout = 30.0

[extract]
# Split PDFs larger than max_pages_per_extraction into multiple MinerU jobs.
# Requires PyMuPDF (fitz) to detect page counts automatically.
split_large_pdfs = true
max_pages_per_extraction = 200
# Total lifetime of one extract job, measured from submitted_at. A poll
# timeout only stands the job down for the current round (state stays
# "running", the remote batch id is kept, polling resumes next run); a job
# that outlives this cap is flipped to failed_manual_review and is never
# auto-resubmitted.
job_max_lifetime_seconds = 21600
# Phase 2 extraction concurrency: segments of a split PDF are all submitted
# first, then harvested concurrently; a key is held only for the duration of
# a single provider call, so per_key_submit_concurrency bounds in-flight
# submits/polls per key.
per_key_submit_concurrency = 1
# Global minimum interval between two MinerU submissions (quota guard; the
# quota is 50/min). 0 disables pacing.
submit_min_interval_seconds = 1.5
# Number of threads harvesting submitted extraction jobs concurrently.
harvest_workers = 2
# Sliding-window cap on MinerU polls per minute (quota is 1000/min). 0
# disables the limiter.
poll_max_per_minute = 600
# Interval between two polls of the same in-flight extraction job.
poll_interval_seconds = 30
# 决策2: max automatic resubmissions of one extract job (counted across runs
# in the job payload). Beyond this cap the job is flipped to
# failed_manual_review and is never auto-resubmitted.
max_resubmit_attempts = 3

[vectors]
# `vectors prune` recycles embedding batches stuck "running" for longer than
# this (a crashed embed otherwise blocks pruning forever). Run prune only
# while no indexing job is active.
stale_embedding_batch_hours = 24

[ingest]
# Phase 3 batch vector publishing: true (default) stages all documents of a
# run and publishes once per profile; false falls back to per-document
# publishing (the legacy behavior).
batch_publish = true

[[embedding_profiles]]
name = "qwen3vl_cloud_2560_text"
provider = "dashscope"
model = "qwen3-vl-embedding"
dimension = 2560
modality = "text"
backend = "lancedb"
enabled = true
default_for_text = true
default_for_multimodal = false
batch_size = 16
query_role_mode = "instruction"
document_role_mode = "plain"
instruction_template = ""
image_policy = {}
# Phase 1: concurrent embedding workers per profile (1 = legacy serial) and
# HTTP-attempt pacing (0 = unlimited; retries count against the limit).
embed_workers = 16
rate_limit = { requests_per_second = 38 }

[[embedding_profiles]]
name = "qwen3vl_cloud_2560_multimodal"
provider = "dashscope"
model = "qwen3-vl-embedding"
dimension = 2560
modality = "multimodal"
backend = "lancedb"
enabled = true
default_for_text = false
default_for_multimodal = true
batch_size = 16
query_role_mode = "instruction"
document_role_mode = "plain"
instruction_template = ""
image_policy = {}
embed_workers = 16
rate_limit = { requests_per_second = 38 }
