[paths]
zotero_db = "E:/ZoteroLib/lib/zotero.sqlite"
zotero_storage = "E:/ZoteroLib/lib/storage"
data_dir = "data"

[server]
host = "127.0.0.1"
port = 8765
require_api_token = true

[extract]
split_large_pdfs = true
max_pages_per_extraction = 200
job_max_lifetime_seconds = 21600

[vectors]
stale_embedding_batch_hours = 24

[[embedding_profiles]]
name = "qwen3vl_cloud_2560_text"
provider = "dashscope"
model = "qwen3-vl-embedding"
dimension = 2560
modality = "text"
backend = "lancedb"
enabled = true
default_for_text = true
default_for_multimodal = false
batch_size = 32
image_policy = {}
# Phase 1: concurrent embedding workers per profile + HTTP-attempt pacing
# (retries included). Scope is one document-profile pass, not global.
embed_workers = 16
rate_limit = { requests_per_second = 38 }

[[embedding_profiles]]
name = "qwen3vl_cloud_2560_multimodal"
provider = "dashscope"
model = "qwen3-vl-embedding"
dimension = 2560
modality = "multimodal"
backend = "lancedb"
enabled = true
default_for_text = false
default_for_multimodal = true
batch_size = 32
image_policy = {}
embed_workers = 16
rate_limit = { requests_per_second = 38 }
